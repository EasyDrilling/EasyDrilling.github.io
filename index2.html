<!-- Калькулятор -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">                                <!-- кодировка -->
    <script type="text/javascript" href="JavaScript.js"></script>                           <!-- подключение ява скрипта -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">                                                   <!-- подключение CSS -->
    <link rel="icon" type="image/png" href="icon/favicon-96x96.png" sizes="96x96" />            <!-- Иконка -->
    <link rel="icon" type="image/svg+xml" href="icon/favicon.svg" />                         <!-- Иконка -->
    <link rel="shortcut icon" href="icon/favicon.ico" />                                             <!-- Иконка -->
    <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png" />               <!-- Иконка -->
    <link rel="manifest" href="icon/site.webmanifest" />                                            <!-- Иконка -->

    <title>Калькулятор бурения</title>                                           <!-- Название сайта -->
</head>

<body>
<div class="card">
<h1>Буровой калькулятор</h1></p>
<div class="tabs">                                                                           <!-- Верхник блок кнопок -->
<button type="button" class="active" onclick="tab('vol', this)">Объем скважины</button>
<button type="button" onclick="tab('hyd', this)">Гидростатика</button>
<button type="button" onclick="tab('mech', this)">ГДИ</button>
<button type="button" onclick="tab('mud', this)">Цементирование</button>
</div>


                      <!-- Объем скважины -->
<div id="vol" class="panel active">
<label>Диаметр колонны (мм)</label>
<input id="vol_d1" type="text" value="245">
<label>Толщина стенки (мм)</label>
<input id="vol_wall" type="text" value="9.2">
<label>Башмак на глубине (м)</label>
<input id="vol_h1" type="text" value="800">
<label>Инструмент (мм)</label>
<input id="vol_dSBT" type="text" value="127">
<label>Толщина стенки (мм)</label>
<input id="vol_wallSBT" type="text" value="9">
<label>Диаметр долота (мм)</label>
<input id="vol_d2" type="text" value="220.7">
<label>Забой (м)</label>
<input id="vol_h2" type="text" value="1600">
<div class="out" id="vol_out">0</div>
<button type="button" class="go" onclick="calcVol()">Рассчитать</button>
</div>

                      <!-- Гидростатика -->
<div id="hyd" class="panel">
<label>Удельный вес раствора (г/см3)</label>
<input id="hyd_y" type="text" value="1.01">
<label>Забой, вертикаль (м)</label>
<input id="hyd_h" type="text" value="3000">
<div class="out" id="hyd_out">0</div>
<button type="button" class="go" onclick="calcHyd()">Рассчитать</button>
</div>

                      <!-- ГДИ -->

<div id="mech" class="panel">
<label><H3> Опрессовка открытого ствола (определение коэффициента приемистости).</H3>
<p>Для скважин с полным поглощением коэффициент приемистости не определяется.</p> 
<p>Буровым насосом проводится прямая промывка до выхода бурового раствора на устье. Производится герметизация затрубного пространства. </p>
<p>С помощью ЦА возобновляется закачка бурового раствора в трубное пространство с контролем избыточного давления на манометре ЦА.</p>
<p>После выхода на установившийся режим (постоянное избыточное давление) закачка бурового раствора продолжается в течение 3 минут (но не более 10 м3). Фиксируется время t и объем закачиваемого раствора V. Рассчитывается расход Q по формуле:</p>
<p>Q=V/t</p>
<p>где:</p>
<p>Q – расход закачиваемой в поглощающий пласт жидкости, м3/ч;</p> 
<p>t – время, в течение которого производится закачка жидкости в пласт, ч;</p> 
<p>V – объем закачанной в поглощающий пласт жидкости, м3.</p>
<p>Коэффициент приемистости определяется по следующей формуле: Кпр=Q/Pизб</p>
<p>где:</p> 
<p>Кпр – коэффициент приемистости, (м3/ч)/МПа;</p> 
<p>Q – расход, м3/ч;</p> 
<p>Ризб – давление нагнетания, МПа.</p>
</label>
<label>t – продолжительность закачки жидкости в пласт (ч.)</label>
<input id="mech_g" type="text" value="12">
<label>V – объем закачанной жидкости, (м3.)</label>
<input id="mech_db" type="text" value="215.9">
<div class="out" id="mech_out">0</div>
<button type="button" class="go" onclick="calcMech()">Рассчитать</button>
</div>

                      <!-- Цементирование -->
<div id="mud" class="panel">
<label>Диаметр D (мм)</label>
<input id="mud_d" type="text" value="245">
<label>Глубина H (м)</label>
<input id="mud_h" type="text" value="3000">
<label>Плотность rho (г/см3)</label>
<input id="mud_rho" type="text" value="1.18">
<div class="out" id="mud_out">0</div>
<button type="button" class="go" onclick="calcMud()">Рассчитать</button>
</div>

<script>
function val(id){return parseFloat(document.getElementById(id).value.replace(",","."));}     //проверка, замена запятой на точку.

//Меню
function tab(id, btn){
var panels=document.querySelectorAll(".panel");
for(var i=0;i<panels.length;i++){panels[i].classList.remove('active');}
document.getElementById(id).classList.add('active');
var buttons=document.querySelectorAll('.tabs button');
for(var j=0;j<buttons.length;j++){buttons[j].classList.remove('active');}
btn.classList.add('active');
}


//Расчёт объема скважины
function calcVol(){
var d1=val('vol_d1'), wall=val('vol_wall'), h1=val('vol_h1'), dSBT=val('vol_dSBT'), wallSBT=val('vol_wallSBT'), d2=val('vol_d2'), h2=val('vol_h2');
if(isNaN(d1)||isNaN(wall)||isNaN(h1)||isNaN(dSBT)||isNaN(wallSBT)||isNaN(d2)||isNaN(h2)){document.getElementById('vol_out').innerHTML='Ошибка';return;}
document.getElementById('vol_out').innerHTML=(
    "<p>" +  "Объем скважины = " + (((d2*d2)*3.14/4*(h2-h1)/1000000)+(((d1-wall)*(d1-wall))*3.14/4*h1/1000000)).toFixed(2) + " м3" + "</p>" +
    "<p>" +  "Объем до башмака ОК " + d1 + "мм = " + (((d1-wall)*(d1-wall))*3.14/4*h1/1000000).toFixed(2) + " м3" + "</p>" +
    "<p>" + "Объем открытого ствола " + d2 + "мм = " + ((d2*d2)*3.14/4*(h2-h1)/1000000).toFixed(2) + " м3" + "</p>" +
    "<p>" + "Объем инструмента " + dSBT + "мм = " + ((dSBT*dSBT*3.14/4*h2/1000000)-((dSBT-wallSBT)*(dSBT-wallSBT)*3.14/4*h2/1000000)).toFixed(2) + " м3" + "</p>" + 
    "<p>" + "Объем затруба " + (((d2*d2)*3.14/4*(h2-h1)/1000000)+(((d1-wall)*(d1-wall))*3.14/4*h1/1000000)-(dSBT*dSBT*3.14/4*h2/1000000)).toFixed(2) + " м3" + "</p>" );
}


//Гидростатика
function calcHyd(){
var y=val('hyd_y'), h=val('hyd_h');
if(isNaN(y)||isNaN(h)){document.getElementById('hyd_out').innerHTML='Ошибка';return;}
document.getElementById('hyd_out').innerHTML=((y*9.81*h)/1000).toFixed(3)+' МПа';
}

function calcMech(){
var g=val('mech_g'), db=val('mech_db');
if(isNaN(g)||isNaN(db)||db<=0){document.getElementById('mech_out').innerHTML='Ошибка';return;}
var f=g*9.81;
var p=(f*1000)/(3.14/4*db*db);
document.getElementById('mech_out').innerHTML=p.toFixed(3)+' МПа';
}

function calcMud(){
var d=val('mud_d'), h=val('mud_h'), rho=val('mud_rho');
if(isNaN(d)||isNaN(h)||isNaN(rho)||d<=0){document.getElementById('mud_out').innerHTML='Ошибка';return;}
var vol=d*d*3.14/4*h/1000000;
var ph=rho*9.81*h/1000;
document.getElementById('mud_out').innerHTML=vol.toFixed(3)+' м3; P='+ph.toFixed(3)+' МПа';
}
calcVol();
</script>
</body>
</html>
